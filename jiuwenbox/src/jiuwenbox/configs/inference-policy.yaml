# Yuanrong (Edge/Remote) configuration.
# This file extends the default policy with inference privacy proxy enabled.
# The proxy runs on the edge server and routes LLM API requests.

version: 1
name: "inference-policy"

inference_privacy_proxies:
  listen_host: "127.0.0.1"  # Set an interface IP / 0.0.0.0 only with JIUWENBOX_PROXY_TOKEN.
  listen_port: 8322  # MUST, set to enable proxy. 0 or omit to disable.
  
  # Deployment-owned exact origins for additional API-managed routes.
  # Corporate DNS names resolving to private IPs must be explicitly listed here.
  allowed_origins: []
  # Prefer a PEM enterprise CA over disabling verification:
  # ca_file: "/etc/jiuwenbox/corp-ca.pem"
  insecure_tls_origins: []

  # Startup route origins are trusted automatically. The REST API cannot add
  # other origins unless they were approved in allowed_origins at startup.
  routes:
    # example OpenAI API route
    - path_prefix: "openai"
      target_endpoint: "https://api.openai.com"
      api_key: "sk_sandbox_managed_key"  # Set your sandbox-managed API key here
      # example:
      # curl -X POST http://127.0.0.1:8322/openai/v1/chat/completions \
      #   -H "Authorization: Bearer sk_fake_key" ...
      # ==> https://api.openai.com/v1/chat/completions \
      #   -H "Authorization: Bearer sk_sandbox_managed_key" ...

    # example Custom LLM endpoint
    - path_prefix: "custom"
      target_endpoint: "http://192.168.1.100:9000"
      api_key: "sk_sandbox_managed_key"
      skip_cert_verify: false # true additionally requires insecure_tls_origins approval
      # example:
      # curl -X POST http://127.0.0.1:8322/custom/v1/chat/completions \
      #   -H "Authorization: Bearer sk_fake_key" ...
      # ==> http://192.168.1.100:9000/v1/chat/completions
      #   -H "Authorization: Bearer sk_sandbox_managed_key" ...
